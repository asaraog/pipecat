name: asaraog-run
on:
  workflow_dispatch:
    inputs:
      ref: {required: true, type: string}
      args: {required: true, type: string}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.ref }}"}
      - uses: astral-sh/setup-uv@v3
        with: {version: "latest"}
      - run: uv python install 3.12
      - run: uv sync --group dev --extra silero
      - run: uv run ruff format --check src tests && uv run ruff check src tests
      - run: uv run pytest -ra ${{ inputs.args }}
